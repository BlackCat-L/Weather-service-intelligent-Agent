# Nginx 反向代理配置（如需替代 Caddy）
#
# 证书用 certbot 申请：
#   sudo certbot --nginx -d weather.example.com

server {
    listen 80;
    server_name weather.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name weather.example.com;

    ssl_certificate     /etc/letsencrypt/live/weather.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weather.example.com/privkey.pem;

    # 前端构建产物单文件最大 1MB（echarts 分块），留些余量
    client_max_body_size 2m;

    # gzip 对 JS/CSS 收益明显（echarts 1MB → 342KB）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        # 带 hash 的构建产物可以长期缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 关键配置：关闭缓冲，否则流式输出会被攒成一大块一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # 长任务超时（多智能体模式可能要跑 1-2 分钟）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
